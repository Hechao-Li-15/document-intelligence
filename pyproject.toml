[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "document-intelligence"
version = "0.1.0"
description = "Streamlit application for document ingestion and structured extraction"
requires-python = ">=3.11"
dependencies = [
    "beautifulsoup4>=4.12",
    "google-api-python-client>=2.0",
    "google-auth-oauthlib>=1.0",
    "pandas>=2.0",
    "pymupdf>=1.23",
    "python-dotenv>=1.0",
    "sqlalchemy>=2.0",
    "streamlit>=1.30",
]

[tool.setuptools.packages.find]
where = ["src"]
